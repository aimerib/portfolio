# Cache the photos hard; HTML stays fresh (Netlify's default).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
